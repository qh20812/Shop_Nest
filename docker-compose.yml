services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopnest-app
    container_name: shopnest-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: Shop_Nest_DB
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: Shop_Nest_DB
      MYSQL_ROOT_PASSWORD: newpassword
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
